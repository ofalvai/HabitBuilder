  macos-kernel-panic:
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.4x-large
    steps:
    - script@1:
        inputs:
        - content: "#!/usr/bin/env bash

            # fail if any commands fails

            set -e

            # make pipelines' return status equal the last command to exit with
            a non-zero status, or zero if all commands exit successfully

            set -o pipefail

            # debug log

            set -x


            DEVICE_OS=\"18.5\"

            echo \"Current iOS version: $DEVICE_OS\"


            # Delete all non-iOS runtimes that don't match our current OS
            version

            xcrun simctl runtime list -j | jq --arg DEVICE_OS $DEVICE_OS '.[] |
            select(.version!=$DEVICE_OS or
            .platformIdentifier!=\"com.apple.platform.iphonesimulator\") |
            .identifier' | xargs -I % xcrun simctl runtime delete %


            # Delete the simulators that are now missing the corresponding
            runtime

            xcrun simctl delete unavailable


            sleep 10


            xcrun simctl runtime dyld_shared_cache update --all

            xcrun simctl runtime dyld_shared_cache remove --all


            sleep 30


            xcrun simctl boot \"Bitrise iOS default\"



            sleep 60\ 

            xcrun simctl shutdown all


            # IDEAS

            # - boot a simulator

            # - xcodebuild\ 

            # xcrun simctl boot \"\""
