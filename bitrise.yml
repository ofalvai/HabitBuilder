---
format_version: '8'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
app:
  envs:
  - PROJECT_LOCATION: "."
    opts:
      is_expand: false
  - MODULE: app
    opts:
      is_expand: false
  - VARIANT: debug
    opts:
      is_expand: false
  - LOGLEVEL: DEBUG
    opts:
      is_expand: false
  - GITHUB_USERNAME: ofalvai
    opts:
      is_expand: false
meta:
  bitrise.io:
    machine_type_id: g2.linux.x-large
    stack: linux-docker-android-22.04
trigger_map:
- push_branch: main
  pipeline: pr-validation
- pull_request_source_branch: test-pr-2
  workflow: git-test
- pull_request_source_branch: "*"
  pipeline: pr-validation
- tag: "*"
  workflow: release
pipelines:
  pr-validation:
    stages:
    - pr-validation-stage: {}
stages:
  pr-validation-stage:
    workflows:
    - build: {}
    - lint: {}
    - emulator-tests: {}
workflows:
  _after-build:
    steps:
    - deploy-to-bitrise-io@2:
        inputs:
        - notify_user_groups: none
    meta:
      bitrise.io:
        stack: osx-xcode-15.4.x
        machine_type_id: g2.mac.large
  _before-build:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - activate-build-cache-for-gradle@2:
        run_if: 'false'
    - restore-gradle-cache@1: {}
  _fix-ubuntu-22:
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x
  annotations:
    steps:
    - script@1:
        inputs:
        - script_file_path:
        - content: |-
            #!/usr/bin/env bash

            set -e
            set -o pipefail
            set -x

            check_cpu_usage() {
              num_cores=$(sysctl -n hw.ncpu)
              max_cpu_usage=$((num_cores * 1000))

              while true; do
                output=$(sudo powermetrics -s tasks -n 1 --order cputime)
                processes=$(echo "$output" | awk '/^Name/ { table_start=1; print $0; next } table_start == 1 { print } /^ALL_TASKS/ { next }')

                msg=""
                while IFS= read -r line; do
                  if [[ "$line" =~ ^Name ]]; then
                    continue
                  elif [[ "$line" =~ ^ALL_TASKS ]]; then
                    continue
                  elif [[ -z "$line" ]]; then
                    msg+=$'\n' # Use $'\n' for actual newlines
                  else
                    name=$(echo "$line" | awk '{ print $1 }')
                    cpu_usage=$(echo "$line" | awk '{ print $3 }')
                    cpu_usage_int=$( printf "%d" "${cpu_usage%.*}" )
                    bar_length=$((cpu_usage_int * 50 / max_cpu_usage))
                    bar=$(printf "%${bar_length}s" | sed 's/ /█/g')
                    empty_bar=$(printf "%$((50 - bar_length))s" | sed 's/ /░/g')
                    msg+=$'\n'"${bar}${empty_bar} **${name}:** ${cpu_usage} ms/s CPU time"
                  fi
                done <<< "$processes"

                read -r -d '' to_print << EOM
            ## CPU Usage:
            $msg
            EOM

                bitrise :annotations annotate "$to_print" --context cpu_usage
              done
            }

            nohup bash -c "$(declare -f check_cpu_usage); check_cpu_usage" &
    after_run:
    - build
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: g2.linux.large
  aws-agent:
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            sleep 999
  build:
    description: Builds the app module and runs unit tests
    before_run:
    - _before-build
    after_run:
    - _after-build
    steps:
    - android-build@1:
        inputs:
        - variant: debug
        - module: app
        - arguments: -Dorg.gradle.jvmargs="-Xmx3G -Xms1G -XX:+UseParallelGC
            -XX:MaxMetaspaceSize=1g"
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: debug
        - arguments: -Dorg.gradle.jvmargs="-Xmx3G -Xms1G -XX:+UseParallelGC
            -XX:MaxMetaspaceSize=1g"
    - save-gradle-cache@1: {}
  cache-tuning:
    before_run:
    - _before-build
    after_run:
    - _after-build
    steps:
    - script@1:
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            apt install -y file

            git clone https://github.com/facebook/zstd.git
            cd zstd
            make
            make check
            make install
    - git::https://github.com/bitrise-steplib/steps-ios-auto-provision@master: {}
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6:
        inputs:
        - clone_depth: '10'
        - merge_pr: 'no'
        - update_submodules: 'no'
    - git::https://github.com/bitrise-steplib/bitrise-step-restore-cache.git@PLANG-2011-download-cache:
        run_if: 'true'
        inputs:
        - key: '{{ .OS }}-{{ .Arch }}-gradle-cache-{{ checksum "**/*.gradle"
            "**/gradle-wrapper.properties" }}'
        - verbose: 'true'
    - android-build@1:
        inputs:
        - variant: debug
        - module: app
    - script@1:
        title: Benchmark
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            tar -cf test.tar ~/.gradle/caches ~/.gradle/wrapper

            zstd -v

            zstd -b3 -T0 test.tar

            zstd -b3 -T0 --fast test.tar

            zstd -b3 -T0 --long test.tar
    - script@1:
        title: Benchmark latest
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            git clone git@github.com:facebook/zstd.git

            cd zstd

            make
            sudo make install
            cd ..

            zstd -v

            zstd -b3 -T0 test.tar

            zstd -b3 -T0 --fast test.tar

            zstd -b3 -T0 --long test.tar
    - git::https://github.com/bitrise-steplib/bitrise-step-save-cache.git@main:
        run_if: 'true'
        inputs:
        - key: '{{ .OS }}-{{ .Arch }}-gradle-cache-{{ checksum "**/*.gradle"
            "**/gradle-wrapper.properties"}}'
        - paths: |-
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
        - verbose: 'true'
    meta:
      bitrise.io:
        stack: osx-xcode-14.2.x-ventura
        machine_type_id: g2-m1-max.5core
  cluster-checker:
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            echo "Stack rev ID:"
            echo $BITRISE_OSX_STACK_REV_ID

            hostname
            sw_vers
