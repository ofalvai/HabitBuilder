    - activate-ssh-key@4: {}
    - deploy-to-bitrise-io@2: {}
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            echo "Stack rev ID:"
            echo $BITRISE_STACK_REV_ID

            asdf current
            asdf list python

            which -a envman
            envman --help

            echo $PATH


            ls -la $PWD
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id:
