        inputs:
        - gradlew_path: "./gradlew"
        - gradle_task: buildHealth
        - gradle_options: "--stacktrace"
    - script@1:
        title: Move dependency analysis to deploy dir
        is_always_run: true
        inputs:
        - content: |-
