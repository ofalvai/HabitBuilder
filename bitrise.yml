            avg_file_size=$(( total_size_bytes / num_files ))  # average bytes
            per file


            echo \"Creating folder $folder ...\"

            mkdir -p \"$folder\"


            echo \"Generating $num_files files of approx $avg_file_size bytes
            each...\"


            for ((i=1; i<=num_files; i++)); do

            \    # Create a file with random data of avg_file_size bytes

            \    head -c $avg_file_size </dev/urandom > \"$folder/file_$i.bin\"

            \   \ 

            \    # Small progress display

            \    if (( i % 10000 == 0 )); then

            \        echo \"$i files created...\"

            \    fi

            done


            echo \"Finished creating files.\"


            archive=\"large_folder.tar.zst\"


            echo \"Compressing $folder into $archive using tar and zstd...\"


            tar --use-compress-program=zstd -cf \"$archive\" \"$folder\"


            echo \"Compression complete: $archive\""
        title: Compress
    - script@1:
        title: Decompress
        inputs:
        - content: |-
            #!/bin/bash
            set -eo pipefail

            archive="large_folder.tar.zst"
            target_dir="$PWD"

            echo "Extracting $archive to $target_dir ..."

            mkdir -p "$target_dir"

            tar --use-compress-program="zstd -d" -x -f "$archive" -P --directory "$target_dir"

