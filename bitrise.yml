  macos-hacking:
    steps:
    - script@1:
        inputs:
        - content: |
            #!/bin/bash

            set -eo pipefail

            MAX_ITERATIONS=50
            SLEEP_TIME=1
            ERROR_MESSAGE="unavailable, liblaunch_sim.dylib could not be opened"

            for i in $(seq 1 $MAX_ITERATIONS); do
              echo "Attempt $i of $MAX_ITERATIONS..."
              OUTPUT=$(xcrun simctl list runtimes 2>&1)

              if echo "$OUTPUT" | grep -q "$ERROR_MESSAGE"; then
                echo "Error detected: '$ERROR_MESSAGE'. Retrying in $SLEEP_TIME second(s)..."
                sleep $SLEEP_TIME
              else
                echo "Error message not found. Exiting loop."
                exit 0
              fi
            done

