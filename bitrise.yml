    steps:
    - apt-get-install@0:
        inputs:
        - packages: zsh
    - set-java-version@1:
        inputs:
        - set_java_version: 17
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env zsh

            set -x

            function install_homebrew() {
              CI=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            }

            max_tries=3
            retries=0
            brew=/home/linuxbrew/.linuxbrew/bin/brew

            while ! install_homebrew && [[ $retries -lt $max_tries ]]; do
              ((retries++)) || true
              if [[ $retries -lt $max_tries ]]; then
                echo "Homebrew installation failed. Attempting retry #$retries." >&2
                sleep 2
              fi
            done

            set -e

            test -x $brew
            eval "$($brew shellenv)"

            bitrise envman add --key HOMEBREW_CELLAR --value "$HOMEBREW_CELLAR"
            bitrise envman add --key HOMEBREW_REPOSITORY --value "$HOMEBREW_REPOSITORY"
            bitrise envman add --key PATH --value "$PATH"
            bitrise envman add --key MANPATH --value "$MANPATH"
            bitrise envman add --key INFOPATH --value "$INFOPATH"

            echo "Number of retries: $retries" >&2
        title: Install Homebrew
    - activate-ssh-key@4: {}
