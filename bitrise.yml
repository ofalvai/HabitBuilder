  govulncheck:
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            echo "Stack rev ID:"
            echo $BITRISE_OSX_STACK_REV_ID

            bitrise version

            go install golang.org/x/vuln/cmd/govulncheck@latest
            asdf reshim golang

            govulncheck -mode=binary ~/.bitrise/tools/envman || true
            govulncheck -mode=binary ~/.bitrise/tools/stepman || true
            govulncheck -mode=binary ~/bitrise-den-agent || true
            govulncheck -mode=binary /usr/local/bin/bitrise || true
            govulncheck -mode=binary /usr/local/bin/ngrok || true
  lint:
    before_run:
    - _before-build
    after_run:
    - _after-build
    steps:
    - android-lint@0:
        inputs:
        - variant: debug
        - module: app
    - gradle-runner@2:
